<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<title>IronLog</title>
<style>
:root{--bg:#000;--card:#0f0f10;--line:#1e1e21;--mut:#86868b;--fg:#f5f5f7;--in:#171719}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.1;margin:18px 0 2px;letter-spacing:-.02em}
h2{font-size:17px;margin:0}
.mut{color:var(--mut)}.sm{font-size:13px}.hidden{display:none!important}
button{font:inherit;color:var(--fg);background:var(--in);border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
button:active{opacity:.6}
button.sm{padding:8px 12px}
button.pri{background:#f5f5f7;color:#000;font-weight:650;width:100%;padding:15px;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:750;letter-spacing:.02em}
.days{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;font-size:14px;color:var(--mut);background:transparent;border:1px solid var(--line)}
.chip.t{color:var(--fg)}.chip.on{background:#f5f5f7;color:#000;border-color:#f5f5f7;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:3px;background:var(--line);border-radius:3px;margin:12px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:#f5f5f7;transition:width .25s}
.ex{padding:18px 0;border-top:1px solid var(--line)}.ex:first-child{border-top:0;padding-top:4px}.ex:last-child{padding-bottom:4px}
.en{font-weight:650;font-size:17px}
.last{font-size:13px;color:var(--mut);margin-top:8px}
.hint{font-size:13px;margin-top:4px}
.sets{display:grid;grid-template-columns:22px 1fr 1fr 1fr 46px;gap:8px;align-items:center;margin-top:12px}
.sets .h{font-size:12px;color:var(--mut);text-align:center}
.sets .n{color:var(--mut);text-align:center;font-size:14px}
input,select{font:inherit;font-size:17px;background:var(--in);color:var(--fg);border:1px solid transparent;border-radius:10px;outline:0;width:100%;min-width:0}
.sets input{height:44px;text-align:center;padding:0 4px}
input:focus,select:focus{border-color:#4a4a50}
::placeholder{color:#4b4b50}
.ck{height:44px;width:46px;padding:0;color:var(--mut);font-size:18px}
.ck.done{background:#f5f5f7;color:#000}
.add{margin-top:10px;background:transparent;border:1px dashed var(--line);color:var(--mut);width:100%}
.bw{width:96px;height:40px;text-align:center;font-size:19px}
canvas{width:100%;height:150px;display:block;margin-top:12px}
select{height:42px;padding:0 10px;margin-top:10px}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.li:first-of-type{border-top:0}
.x{background:none;padding:2px 8px;color:var(--mut)}
.nav,.tb{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:10}
.nav{bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;color:var(--mut);padding:12px 0}.nav button.on{color:var(--fg);font-weight:650}
.tb{bottom:calc(60px + env(safe-area-inset-bottom));padding:0 12px;display:none}
.tb.show{display:block}
.tbi{background:#1c1c1f;border-radius:18px;padding:12px 14px;box-shadow:0 6px 30px rgba(0,0,0,.7)}
.tt{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tbi .bar{margin-top:8px;background:#2c2c30}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-90px);background:#f5f5f7;color:#000;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:30;transition:transform .25s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .card{width:100%;max-width:520px;background:#161618}
</style>
</head>
<body>
<div class="top"><div class="logo">IronLog</div><div class="mut sm" id="today"></div></div>
<section id="home"></section>
<section id="prog" class="hidden"></section>
<input id="file" type="file" accept=".json,application/json" hidden onchange="imp(event)">

<div class="tb" id="tb"><div class="tbi">
  <div class="row"><div class="tt" id="tt">0:00</div>
  <div class="row" style="gap:6px"><button class="sm" onclick="adj(-15)">−15</button><button class="sm" onclick="adj(15)">+15</button><button class="sm" onclick="stopRest()">Skip</button></div></div>
  <div class="bar"><i id="tf" style="width:100%"></i></div>
</div></div>

<nav class="nav">
  <button id="nw" class="on" onclick="showTab('workout')">Workout</button>
  <button id="np" onclick="showTab('progress')">Progress</button>
  <button id="nt" onclick="navTimer()">Timer</button>
</nav>
<div id="toast"></div>
<div class="sheet hidden" id="sheet" onclick="this.classList.add('hidden')"><div class="card" onclick="event.stopPropagation()"><div id="sc"></div><button class="pri" onclick="$('sheet').classList.add('hidden')">Close</button></div></div>

<script>
/* ---------- Program (same plan as before) ---------- */
const P={
Mon:{n:"Push A",f:"Chest emphasis",e:[["Incline DB Press",3,"6–10"],["Flat Machine Chest Press",3,"8–12"],["Cable Fly",2,"10–15"],["Seated DB Shoulder Press",3,"6–10"],["Cable Lateral Raise",3,"12–20"],["Overhead Cable Triceps Extension",3,"10–15"],["Cable Pressdown",2,"10–15"]]},
Tue:{n:"Pull A",f:"Back and biceps",e:[["Pull-ups",3,"6–10"],["Chest-Supported Row",3,"8–12"],["Lat Pulldown",2,"10–15"],["Cable Row",2,"8–12"],["Preacher Curl",3,"8–12"],["Bayesian Cable Curl",3,"10–15"],["Hammer Curl",2,"10–15"],["Reverse Wrist Curl",2,"15–20"],["Wrist Curl",2,"15–20"]]},
Wed:{n:"Legs A",f:"Quad emphasis",e:[["Leg Press",3,"6–10"],["Bulgarian Split Squat",3,"8–12 / leg"],["Leg Extension",3,"10–15"],["Hamstring Curl",3,"10–15"],["Romanian Deadlift",2,"8–12"],["Standing Calf Raise",4,"8–15"],["Seated Calf Raise",2,"12–20"]]},
Thu:{n:"Push B",f:"Chest and lateral delts",e:[["Flat Barbell / Smith Press",3,"6–10"],["Incline Machine Press",3,"8–12"],["Cable Fly",2,"12–15"],["Machine Shoulder Press",2,"8–12"],["Cable Lateral Raise",4,"12–20"],["Overhead Triceps Extension",3,"10–15"],["Single-Arm Cable Pressdown",2,"12–15"]]},
Fri:{n:"Pull B",f:"Back and traps",e:[["Lat Pulldown / Weighted Pull-up",3,"6–10"],["Chest-Supported T-Bar Row",3,"8–12"],["One-Arm Cable Lat Row",2,"10–15"],["Straight-Arm Pulldown",2,"12–15"],["EZ-Bar Curl",3,"6–10"],["Incline DB Curl",3,"8–12"],["Cross-Body Hammer Curl",2,"10–15"],["DB / Cable Shrug",3,"10–15"],["Rear-Delt Fly",2,"15–20"]]},
Sat:{n:"Legs B + Shoulders",f:"Legs, shoulders and traps",e:[["Leg Press",3,"8–12"],["Bulgarian Split Squat",2,"8–12 / leg"],["Hamstring Curl",3,"8–12"],["Leg Extension",2,"12–15"],["Seated Calf Raise",3,"10–20"],["Seated DB Shoulder Press",3,"8–12"],["Cable Lateral Raise",4,"12–20"],["Reverse Pec Deck",3,"12–20"],["DB / Cable Shrug",2,"10–15"]]},
Sun:{n:"Rest",f:"Recovery",e:[]}
};
const DAYS=Object.keys(P),RS=[60,90,120,180,240];

/* ---------- State (same storage key + shape as the old app, so old data carries over) ---------- */
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const iso=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); // local date, not UTC
const fmt=s=>Math.floor(s/60)+":"+pad(s%60);
let D;try{D=JSON.parse(localStorage.getItem("ironlog"))}catch{}
if(!D||!D.logs)D={logs:{},weights:[]};D.weights=D.weights||[];D.rest=D.rest||90;
const save=()=>{try{localStorage.setItem("ironlog",JSON.stringify(D))}catch{toast("Could not save. Storage is blocked or full.")}};
const todayKey=DAYS[(new Date().getDay()+6)%7];
const START="2026-09-28"; // program start: Mon 28 Sep 2026
const dayIdx=()=>{const n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),n.getDate()),[y,m,d]=START.split("-");return Math.round((a-new Date(+y,m-1,+d))/864e5)};
let sel=dayIdx()<0?"Sat":todayKey,pex="";
const lk=()=>iso()+"_"+sel;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400)}
function sheet(h){$("sc").innerHTML=h;$("sheet").classList.remove("hidden")}

/* ---------- Log helpers ---------- */
const blank=e=>Array.from({length:e[1]},()=>({w:"",r:"",rir:""}));
const cur=(ei,make)=>{const e=P[sel].e[ei],l=D.logs[lk()]||(make?D.logs[lk()]={}:{});return l[e[0]]||(make?l[e[0]]=blank(e):blank(e))};
const ok=s=>s.done||(s.w&&s.r);
const e1=s=>s.w&&s.r?(+s.w)*(1+(+s.r)/30):0;
const topE=a=>Math.max(0,...a.filter(ok).map(e1));
const vol=a=>a.filter(ok).reduce((t,s)=>t+(+s.w||0)*(+s.r||0),0);
function prev(name){const ks=Object.keys(D.logs).sort().reverse();for(const k of ks){if(k===lk())continue;const a=D.logs[k][name];if(a&&a.some(x=>x.w||x.r))return{a,d:k.split("_")[0]}}return null}
function best(name,ex){let b=0;for(const k in D.logs)if(k!==ex&&D.logs[k][name])b=Math.max(b,topE(D.logs[k][name]));return b}
const ghost=(pv,s)=>pv?(pv.a[s]||pv.a[pv.a.length-1]):{};
const bwOn=d=>{const x=D.weights.find(w=>w.date===d);return x?x.weight:""};
const latestW=()=>D.weights.length?D.weights[D.weights.length-1].weight:"";

/* ---------- Workout screen ---------- */
function render(){
  $("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  const p=P[sel];
  let h=`<div class="days">${DAYS.map(d=>`<button class="chip ${d===sel?"on":""} ${d===todayKey?"t":""}" onclick="sel='${d}';render()">${d}</button>`).join("")}</div>`;
  const di=dayIdx();
  if(di<0)h+=`<div class="card"><b>Program starts Mon 28 Sep 2026</b><div class="mut sm">${-di===1?"Tomorrow":"In "+(-di)+" days"}. You can still look around and log early.</div></div>`;
  else $("today").textContent+=`  ·  Week ${Math.floor(di/7)+1}`;
  const bw=`<div class="card row"><div><b>Bodyweight</b><div class="mut sm">kg, saved for today</div></div><input class="bw" inputmode="decimal" placeholder="${latestW()||"kg"}" value="${bwOn(iso())}" onchange="setBW(this.value)"></div>`;
  if(!p.e.length){$("home").innerHTML=h+`<h1>Rest day</h1><p class="mut">Recovery is part of the program. Log your bodyweight and get ready for Monday.</p>`+bw;return}
  let tot=0,dn=0;
  const body=p.e.map((e,ei)=>{
    const ss=cur(ei),pv=prev(e[0]),hi=+e[2].match(/\d+/g).pop(),lg=pv&&pv.a.filter(x=>x.w&&x.r);
    const up=lg&&lg.length&&lg.every(x=>+x.r>=hi);
    tot+=ss.length;dn+=ss.filter(x=>x.done).length;
    return `<div class="ex"><div class="row" style="align-items:flex-start"><div><div class="en">${e[0]}</div><div class="mut sm">${e[1]} sets × ${e[2]} reps</div></div><button class="sm" onclick="fill(${ei})">Copy last</button></div>
    ${pv?`<div class="last">Last (${new Date(pv.d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}): ${pv.a.filter(x=>x.w||x.r).map(x=>`${x.w||"–"}×${x.r||"–"}`).join(",  ")}</div>`:""}
    ${up?`<div class="hint">You hit ${hi} reps on every set. Try adding weight.</div>`:""}
    <div class="sets"><span class="h">Set</span><span class="h">kg</span><span class="h">Reps</span><span class="h">RIR</span><span></span>
    ${ss.map((v,s)=>{const g=ghost(pv,s);return `<span class="n">${s+1}</span><input inputmode="decimal" value="${v.w}" placeholder="${g.w||"kg"}" oninput="sv(${ei},${s},'w',this.value)"><input inputmode="numeric" value="${v.r}" placeholder="${g.r||"reps"}" oninput="sv(${ei},${s},'r',this.value)"><input inputmode="numeric" value="${v.rir}" placeholder="${g.rir||"RIR"}" oninput="sv(${ei},${s},'rir',this.value)"><button class="ck ${v.done?"done":""}" onclick="tg(${ei},${s})">✓</button>`}).join("")}</div>
    <button class="add sm" onclick="addSet(${ei})">+ Add set</button></div>`}).join("");
  h+=`<h1>${p.n}</h1><div class="row"><span class="mut">${p.f}</span><button class="sm" onclick="cyc()">Rest ${fmt(D.rest)}</button></div>
  <div class="bar"><i style="width:${tot?dn/tot*100:0}%"></i></div><div class="mut sm" style="margin-top:6px">${dn} of ${tot} sets done</div>`+bw+`<div class="card">${body}</div><button class="pri" onclick="finish()">Finish workout</button>`;
  $("home").innerHTML=h;
}
function sv(ei,s,f,v){cur(ei,1)[s][f]=v.replace(",",".");save()}
function tg(ei,s){
  const a=cur(ei,1),v=a[s],g=ghost(prev(P[sel].e[ei][0]),s);
  v.done=!v.done;
  if(v.done){["w","r","rir"].forEach(f=>{if(!v[f])v[f]=(s>0&&a[s-1][f])||g[f]||""});startRest()}
  save();render();
}
function addSet(ei){cur(ei,1).push({w:"",r:"",rir:""});save();render()}
function fill(ei){const pv=prev(P[sel].e[ei][0]);if(!pv)return toast("No previous log yet");cur(ei,1).forEach((x,i)=>{const g=ghost(pv,i);x.w=g.w||"";x.r=g.r||"";x.rir=g.rir||"";x.done=false});save();render()}
function setBW(v){v=parseFloat(String(v).replace(",","."));if(!v)return;D.weights=D.weights.filter(w=>w.date!==iso());D.weights.push({date:iso(),weight:v});D.weights.sort((a,b)=>a.date.localeCompare(b.date));save();toast("Bodyweight saved")}
function cyc(){D.rest=RS[(RS.indexOf(D.rest)+1)%RS.length];save();render()}
function finish(){
  const l=D.logs[lk()]||{};let n=0,v=0,pr=[];
  for(const nm in l){const a=l[nm];n+=a.filter(ok).length;v+=vol(a);const b=best(nm,lk());if(b&&topE(a)>b)pr.push(nm)}
  if(!n)return toast("Log a set first");
  stopRest();
  sheet(`<h2>Workout complete</h2><p class="mut">${n} sets, ${Math.round(v).toLocaleString()} kg total volume.</p>${pr.length?`<p><b>New best:</b> ${pr.join(", ")}</p>`:""}`);
}

/* ---------- Rest timer (in-app, survives screen lock because it uses an end time) ---------- */
let T=0,TT=0,fired=0,ac,wl;
function startRest(sec){
  TT=sec||D.rest;T=Date.now()+TT*1000;fired=0;$("tb").classList.add("show");
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}
  wake();tick();
}
function stopRest(){T=0;$("tb").classList.remove("show");$("nt").textContent="Timer"}
function adj(n){if(!T)return;T+=n*1000;TT=Math.max(1,TT+n);fired=0;tick()}
function navTimer(){T?stopRest():startRest()}
function tick(){
  if(!T)return;
  const r=Math.max(0,Math.ceil((T-Date.now())/1000));
  $("tt").textContent=r?fmt(r):"Go";$("tf").style.width=Math.min(100,r/TT*100)+"%";$("nt").textContent="Stop";
  if(!r&&!fired){fired=1;beep();setTimeout(()=>{if(fired&&T&&Date.now()>=T)stopRest()},6000)}
}
function beep(){
  try{[0,.25,.5].forEach(d=>{const t=ac.currentTime+d,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)})}catch{}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}
}
async function wake(){try{wl=await navigator.wakeLock.request("screen")}catch{}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&T)wake();tick()});
setInterval(tick,250);

/* ---------- Progress screen ---------- */
function showTab(t){
  const w=t==="workout";
  $("home").classList.toggle("hidden",!w);$("prog").classList.toggle("hidden",w);
  $("nw").classList.toggle("on",w);$("np").classList.toggle("on",!w);
  if(w)render();else renderProg();
  scrollTo(0,0);
}
function chart(id,pts,unit){
  const c=$(id);if(!c)return;const r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*r;c.height=h*r;
  const x=c.getContext("2d");x.scale(r,r);x.font="12px -apple-system,sans-serif";
  if(pts.length<2){x.fillStyle="#555";x.fillText("Log at least 2 entries to see a trend.",4,h/2);return}
  const ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),pd=(mx-mn||1)*.25,lo=mn-pd,hi=mx+pd,L=10,R=w-10;
  const px=i=>L+i*(R-L)/(pts.length-1),py=y=>h-24-(y-lo)/(hi-lo)*(h-48);
  x.strokeStyle="#f5f5f7";x.lineWidth=2;x.lineJoin="round";x.beginPath();pts.forEach((p,i)=>i?x.lineTo(px(i),py(p.y)):x.moveTo(px(i),py(p.y)));x.stroke();
  x.fillStyle="#f5f5f7";pts.forEach((p,i)=>{x.beginPath();x.arc(px(i),py(p.y),3,0,7);x.fill()});
  x.fillStyle="#86868b";x.textAlign="left";x.fillText(`${mn.toFixed(1)} to ${mx.toFixed(1)} ${unit}`,L,12);x.fillText(pts[0].d.slice(5),L,h-4);x.textAlign="right";x.fillText(pts[pts.length-1].d.slice(5),R,h-4);
}
function renderProg(){
  const names=[...new Set(Object.values(D.logs).flatMap(l=>Object.keys(l).filter(n=>l[n].some(ok))))].sort();
  if(!names.includes(pex))pex=names[0]||"";
  const best1=pex?Object.keys(D.logs).flatMap(k=>{const a=(D.logs[k][pex]||[]).filter(ok);return a.map(s=>({...s}))}).sort((a,b)=>e1(b)-e1(a))[0]:null;
  const hist=Object.keys(D.logs).sort().reverse().map(k=>{const[d,dk]=k.split("_"),l=D.logs[k];let n=0,v=0;for(const nm in l){n+=l[nm].filter(ok).length;v+=vol(l[nm])}return n?{d,dk,n,v}:null}).filter(Boolean).slice(0,15);
  const ws=D.weights.slice(-30);
  $("prog").innerHTML=`<h1>Progress</h1>
  <div class="card"><h2>Bodyweight</h2><canvas id="c1"></canvas>${D.weights.slice(-7).reverse().map(x=>`<div class="li"><span>${x.date}</span><span><b>${x.weight} kg</b><button class="x" onclick="delW('${x.date}')">✕</button></span></div>`).join("")||'<p class="mut sm">Nothing logged yet. Add your weight on the Workout tab.</p>'}</div>
  <div class="card"><h2>Lift trend</h2><div class="mut sm">Best estimated 1-rep max per session</div>
  ${names.length?`<select onchange="pex=this.value;renderProg()">${names.map(n=>`<option ${n===pex?"selected":""}>${n}</option>`).join("")}</select><canvas id="c2"></canvas>${best1?`<div class="mut sm" style="margin-top:8px">Best set: ${best1.w} kg × ${best1.r}</div>`:""}`:'<p class="mut sm">Log a few sets and your lifts will show up here.</p>'}</div>
  <div class="card"><h2>Recent workouts</h2>${hist.map(x=>`<div class="li"><span>${new Date(x.d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})} · ${(P[x.dk]||{}).n||x.dk}</span><span class="mut sm">${x.n} sets · ${Math.round(x.v).toLocaleString()} kg</span></div>`).join("")||'<p class="mut sm">No workouts yet.</p>'}</div>
  <div class="card"><h2>Your data</h2><p class="mut sm">Everything is stored on this phone. Export a backup now and then, and add IronLog to your Home Screen so Safari doesn't clear it.</p>
  <div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="sm" onclick="exp()">Export backup</button><button class="sm" onclick="$('file').click()">Import backup</button><button class="sm" onclick="wipe()">Reset all data</button></div></div>`;
  chart("c1",ws.map(x=>({d:x.date,y:x.weight})),"kg");
  if(pex)chart("c2",Object.keys(D.logs).sort().filter(k=>D.logs[k][pex]&&topE(D.logs[k][pex])).map(k=>({d:k.split("_")[0],y:topE(D.logs[k][pex])})),"kg");
}
function delW(d){D.weights=D.weights.filter(x=>x.date!==d);save();renderProg()}
async function exp(){
  const f=new File([JSON.stringify(D,null,2)],"ironlog-backup-"+iso()+".json",{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();
}
function imp(e){
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const j=JSON.parse(t);if(!j.logs||!Array.isArray(j.weights))throw 0;if(!confirm("Replace your current data with this backup?"))return;D={rest:90,...j};save();renderProg();toast("Backup restored")}).catch(()=>toast("That isn't a valid backup file"));
  e.target.value="";
}
function wipe(){if(confirm("Delete all workout and bodyweight data? This can't be undone.")){D={logs:{},weights:[],rest:90};save();renderProg()}}

 [[30,84,120,12],[34,66,12,48],[52,54,14,72],[114,54,14,72],[134,66,12,48]].forEach(r=>x.fillRect(...r));
 ["apple-touch-icon","icon"].forEach(rel=>{const l=document.createElement("link");l.rel=rel;l.href=c.toDataURL();document.head.appendChild(l)})})();
